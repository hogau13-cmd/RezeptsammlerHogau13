    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
          const parsed = JSON.parse(saved);
          state.recipes = Array.isArray(parsed.recipes) ? parsed.recipes : DEFAULT_RECIPES;
          state.shoppingList = Array.isArray(parsed.shoppingList) ? parsed.shoppingList : [];
          state.mealPlan = parsed.mealPlan || state.mealPlan;
          if (parsed.bread) state.bread = { ...state.bread, ...parsed.bread };
        } else {
          state.recipes = JSON.parse(JSON.stringify(DEFAULT_RECIPES));
        }
      } catch (e) {
        state.recipes = JSON.parse(JSON.stringify(DEFAULT_RECIPES));
      }
      updateBadges();
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          recipes: state.recipes,
          shoppingList: state.shoppingList,
          mealPlan: state.mealPlan,
          bread: state.bread
        }));
      } catch (e) {}
      updateBadges();
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const el = document.createElement('div');
      el.className = `px-4 py-2.5 rounded-xl shadow-lg text-sm font-bold text-white transition transform translate-y-2 opacity-0 ${type === 'error' ? 'bg-red-600' : 'bg-stone-900'}`;
      el.textContent = message;
      container.appendChild(el);
      requestAnimationFrame(() => { el.classList.remove('translate-y-2', 'opacity-0'); });
      setTimeout(() => {
        el.classList.add('translate-y-2', 'opacity-0');
        setTimeout(() => el.remove(), 300);
      }, 3000);
    }

    function updateBadges() {
      const badge = document.getElementById('nav-shop-badge');
      if (badge) {
        const count = state.shoppingList.filter(i => !i.checked).length;
        if (count > 0) { badge.textContent = count; badge.classList.remove('hidden'); }
        else { badge.classList.add('hidden'); }
      }
    }

      else if (state.view === 'bread') main.innerHTML = renderBreadCalculatorView();

    function calculateBreadMetrics() {
      const b = state.bread;
      let totalFlour = b.flours.reduce((sum, f) => sum + (parseFloat(f.grams) || 0), 0);
      if (totalFlour <= 0) totalFlour = 500;

      let starterWater = 0;
      let starterFlour = 0;
      if (b.useSourdough && b.sourdoughPct > 0) {
        starterFlour = totalFlour * (b.sourdoughPct / 100);
        starterWater = starterFlour * (b.sourdoughHydration / 100);
        if (b.subtractStarter) {
          totalFlour = Math.max(100, totalFlour - starterFlour);
        }
      }

      const targetHydrationWater = totalFlour * (b.hydration / 100);
      const totalWater = b.useSourdough && b.subtractStarter ? targetHydrationWater : (targetHydrationWater + starterWater);
      const saltGrams = totalFlour * (b.saltPct / 100);
      const yeastGrams = b.yeastType !== 'none' ? totalFlour * (b.yeastPct / 100) : 0;
      const extraGrams = (b.extras || []).reduce((sum, e) => sum + (parseFloat(e.grams) || 0), 0);

      const totalDoughWeight = totalFlour + totalWater + saltGrams + yeastGrams + (b.useSourdough ? starterFlour : 0) + extraGrams;
      const effectiveHydration = Math.round((totalWater / (totalFlour + (b.useSourdough && b.subtractStarter ? starterFlour : 0))) * 100);

      return {
        totalFlour: Math.round(totalFlour),
        totalWater: Math.round(totalWater),
        saltGrams: Math.round(saltGrams * 10) / 10,
        yeastGrams: Math.round(yeastGrams * 10) / 10,
        starterFlour: Math.round(starterFlour),
        starterWater: Math.round(starterWater),
        totalDoughWeight: Math.round(totalDoughWeight),
        teigausbeute: effectiveHydration + 100,
        effectiveHydration
      };
    }

                  <ul class="divide-y divide-stone-100">

                      <li class="py-2 flex items-center justify-between text-sm ${item.checked ? 'line-through text-stone-400' : 'text-stone-800'}">

                        </label>
                        <button data-action="remove-shop-item" data-index="${item.origIndex}" class="text-stone-300 hover:text-red-600 px-2"><i class="fa-solid fa-xmark"></i></button>

            <button data-action="planner-to-shopping" class="px-4 py-2 bg-orange-50 text-orange-700 hover:bg-orange-100 border border-orange-200 rounded-xl text-xs font-bold">

          <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-7 gap-4">
            ${days.map(day => `
              <div class="bg-white p-4 rounded-2xl border border-stone-200 flex flex-col justify-between">
                <div>
                  <h3 class="font-bold text-sm text-stone-900 mb-3 border-b border-stone-100 pb-2 flex justify-between">

                  <div class="space-y-2 mb-3">

                  </div>

    function renderCookingMode() {
      const r = state.recipes.find(x => x.id === state.activeRecipeId);
      const overlay = document.getElementById('cooking-mode-overlay');
      if (!r) { overlay.classList.add('hidden'); return; }
      const steps = r.steps || [];
      const idx = Math.max(0, Math.min(state.cookingStep, steps.length - 1));

      overlay.classList.remove('hidden');
      overlay.innerHTML = `
        <div class="p-4 border-b border-stone-800 flex items-center justify-between">
          <div>
            <span class="text-xs uppercase tracking-wider text-orange-500 font-bold">Kochmodus</span>
            <h2 class="text-lg font-bold truncate max-w-sm">${escapeHtml(r.title)}</h2>
          </div>
          <button data-action="close-cooking" class="px-3 py-1.5 rounded-xl bg-stone-800 hover:bg-stone-700 text-xs font-semibold">Beenden</button>
        </div>
        <div class="flex-1 flex flex-col items-center justify-center p-6 max-w-2xl mx-auto text-center">
          <div class="w-16 h-16 rounded-full bg-orange-600/20 text-orange-500 flex items-center justify-center text-2xl font-black mb-6">
            ${idx + 1} / ${steps.length}
          </div>
          <p class="text-xl sm:text-2xl font-medium leading-relaxed mb-8">${escapeHtml(steps[idx])}</p>
        </div>
        <div class="p-4 border-t border-stone-800 flex justify-between max-w-2xl mx-auto w-full">
          <button data-action="cooking-prev" ${idx === 0 ? 'disabled' : ''} class="px-5 py-2.5 rounded-xl bg-stone-800 disabled:opacity-30 font-semibold text-sm">Zurück</button>
          <button data-action="cooking-next" class="px-5 py-2.5 rounded-xl bg-orange-600 hover:bg-orange-700 font-semibold text-sm">${idx === steps.length - 1 ? 'Fertig!' : 'Weiter'}</button>
        </div>
      `;
    }

    function openInstallModal() {
      showModal(`
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-extrabold text-stone-900">Als App installieren</h3>
          <button data-action="close-modal" class="text-stone-400 hover:text-stone-700"><i class="fa-solid fa-xmark text-lg"></i></button>

          <div class="p-3.5 rounded-xl bg-stone-50 border border-stone-200">

            <ol class="list-decimal list-inside text-xs space-y-1 text-stone-600">
              <li>Öffne das Menü (drei Punkte oben rechts).</li>

            <ol class="list-decimal list-inside text-xs space-y-1 text-stone-600">
              <li>Tippe unten auf das <strong>Teilen</strong>-Symbol.</li>

    function openStorageModal() {
      showModal(`
        <div class="flex items-center justify-between mb-4">
          <h3 class="text-lg font-extrabold text-stone-900">Speicher & Backup</h3>
          <button data-action="close-modal" class="text-stone-400 hover:text-stone-700"><i class="fa-solid fa-xmark text-lg"></i></button>
        </div>
        <div class="space-y-3">
          <button data-action="export-json" class="w-full py-2.5 bg-orange-600 hover:bg-orange-700 text-white rounded-xl text-sm font-semibold">JSON-Backup herunterladen</button>
          <label class="block w-full py-2.5 bg-stone-100 hover:bg-stone-200 text-stone-800 text-center rounded-xl text-sm font-semibold cursor-pointer">
            Backup wiederherstellen <input id="import-json-file" type="file" accept=".json" class="hidden" />

    function showModal(html) {
      const backdrop = document.getElementById('modal-backdrop');
      const container = document.getElementById('modal-container');
      container.innerHTML = html;
      backdrop.classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modal-backdrop').classList.add('hidden');
    }

    function escapeHtml(str) {
      return (str || '').toString().replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function formatAmount(amount, ratio) {
      if (!amount || isNaN(amount)) return amount || '';
      const val = parseFloat(amount) * ratio;
      return val % 1 === 0 ? val : val.toFixed(1);
    }

    function guessAisle(name) {
      const n = (name || '').toLowerCase();
      if (n.includes('mehl') || n.includes('zucker') || n.includes('backpulver')) return 'Backzutaten & Mehl';
      if (n.includes('milch') || n.includes('käse') || n.includes('butter') || n.includes('ei')) return 'Milchprodukte & Eier';
      if (n.includes('tomate') || n.includes('zwiebel') || n.includes('salat') || n.includes('kräuter') || n.includes('zitron')) return 'Obst & Gemüse';
      if (n.includes('fleisch') || n.includes('schinken') || n.includes('speck') || n.includes('hähnchen')) return 'Fleisch & Wurst';
      if (n.includes('wasser') || n.includes('saft') || n.includes('wein') || n.includes('prosecco')) return 'Getränke';
      return 'Sonstiges';
    }

    // ==========================================
    // 5. EVENT HANDLERS
    // ==========================================
    document.addEventListener('click', (e) => {
      const target = e.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;

      if (action === 'nav') {
        state.view = target.dataset.view;
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else if (action === 'open-recipe') {
        state.activeRecipeId = target.dataset.id;
        state.currentServings = state.recipes.find(x => x.id === state.activeRecipeId)?.servings || 2;
        state.view = 'detail';
        render();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else if (action === 'toggle-fav') {
        e.stopPropagation();
        const r = state.recipes.find(x => x.id === target.dataset.id);
        if (r) { r.favorite = !r.favorite; saveState(); render(); }
      } else if (action === 'delete-recipe') {
        e.stopPropagation();
        if (confirm('Dieses Rezept wirklich löschen?')) {
          state.recipes = state.recipes.filter(x => x.id !== target.dataset.id);
          saveState();
          if (state.view === 'detail') state.view = 'recipes';
          render();
          showToast('Rezept gelöscht.');
        }
      } else if (action === 'select-category') {
        state.selectedCategory = target.dataset.category;
        if (state.selectedCategory !== 'Getränke') state.selectedDrinkType = 'Alle';
        render();
      } else if (action === 'select-diet') {
        state.selectedDiet = target.dataset.diet;
        render();
      } else if (action === 'select-drink-type') {
        state.selectedDrinkType = target.dataset.drinkType;
        render();
      } else if (action === 'toggle-fav-filter') {
        state.onlyFavorites = !state.onlyFavorites;
        render();
      } else if (action === 'rate-recipe') {
        const r = state.recipes.find(x => x.id === target.dataset.id);
        if (r) { r.rating = parseInt(target.dataset.rating, 10); saveState(); render(); }
      } else if (action === 'change-servings') {
        const delta = parseInt(target.dataset.delta, 10);
        state.currentServings = Math.max(1, (state.currentServings || 2) + delta);
        render();
      } else if (action === 'toggle-ing-check') {
        state.checkedIngredients[target.dataset.key] = !state.checkedIngredients[target.dataset.key];
        render();
      } else if (action === 'toggle-step-check') {
        state.checkedSteps[target.dataset.key] = !state.checkedSteps[target.dataset.key];
        render();
      } else if (action === 'add-recipe-to-shopping') {
        const r = state.recipes.find(x => x.id === target.dataset.id);
        if (r) {
          const ratio = (state.currentServings || r.servings || 2) / (r.servings || 2);
          (r.ingredients || []).forEach(ing => {
            state.shoppingList.push({ ...ing, amount: formatAmount(ing.amount, ratio), checked: false });
          });
          saveState();
          showToast('Zutaten zur Einkaufsliste hinzugefügt!');
        }
      } else if (action === 'edit-recipe') {
        state.editingRecipe = state.recipes.find(x => x.id === target.dataset.id);
        state.view = 'editor';
        render();
      } else if (action === 'print-recipe') {
        window.print();
      } else if (action === 'start-cooking') {
        state.cookingStep = 0;
        renderCookingMode();
      } else if (action === 'close-cooking') {
        document.getElementById('cooking-mode-overlay').classList.add('hidden');
      } else if (action === 'cooking-prev') {
        state.cookingStep = Math.max(0, state.cookingStep - 1);
        renderCookingMode();
      } else if (action === 'cooking-next') {
        const r = state.recipes.find(x => x.id === state.activeRecipeId);
        if (r && state.cookingStep < r.steps.length - 1) {
          state.cookingStep++;
          renderCookingMode();
        } else {
          document.getElementById('cooking-mode-overlay').classList.add('hidden');
          showToast('Guten Appetit! 🎉');
        }
      } else if (action === 'toggle-bread-goal') {
        const goal = target.dataset.goal;
        const idx = state.bread.goals.indexOf(goal);
        if (idx !== -1) state.bread.goals.splice(idx, 1);
        else if (state.bread.goals.length < 3) state.bread.goals.push(goal);
        else showToast('Maximal 3 Ziele wählbar.', 'error');
        saveState(); render();
      } else if (action === 'apply-bread-assistant') {
        showToast('Assistenten-Einstellungen angewendet!');
      } else if (action === 'bread-add-flour') {
        state.bread.flours.push({ name: 'Dinkelmehl 630', grams: 100 });
        saveState(); render();
      } else if (action === 'bread-remove-flour') {
        if (state.bread.flours.length > 1) {
          state.bread.flours.splice(parseInt(target.dataset.index, 10), 1);
          saveState(); render();
        }
      } else if (action === 'bread-save-recipe') {
        const m = calculateBreadMetrics();
        const newR = {
          id: 'r_' + Date.now(),
          title: state.bread.recipeTitle || 'Mein Brot',
          category: 'Backen',
          diet: 'Vegetarisch',
          prepTime: 120,
          servings: 8,
          rating: 5,
          favorite: true,
          image: 'https://images.unsplash.com/photo-1509440159596-0249088772ff?auto=format&fit=crop&w=900&q=80',
          tags: ['Brot', `TA ${m.teigausbeute}`],
          notes: `Berechnet mit Teigrechner: Gesamtgewicht ${m.totalDoughWeight}g, Hydration ${m.effectiveHydration}%.`,
          ingredients: state.bread.flours.map(f => ({ amount: f.grams, unit: 'g', name: f.name, aisle: 'Backzutaten & Mehl' }))
            .concat([{ amount: m.totalWater, unit: 'g', name: 'Wasser', aisle: 'Getränke' }, { amount: m.saltGrams, unit: 'g', name: 'Salz', aisle: 'Gewürze & Backzutaten' }]),
          steps: ['Teig kneten', 'Gären lassen', 'Backen']
        };
        state.recipes.unshift(newR);
        saveState();
        state.activeRecipeId = newR.id;
        state.view = 'detail';
        render();
        showToast('Brot als Rezept gespeichert!');
      } else if (action === 'bread-to-shopping') {
        const m = calculateBreadMetrics();
        state.bread.flours.forEach(f => state.shoppingList.push({ amount: f.grams, unit: 'g', name: f.name, aisle: 'Backzutaten & Mehl', checked: false }));
        state.shoppingList.push({ amount: m.totalWater, unit: 'g', name: 'Wasser', aisle: 'Getränke', checked: false });
        state.shoppingList.push({ amount: m.saltGrams, unit: 'g', name: 'Salz', aisle: 'Gewürze & Backzutaten', checked: false });
        saveState();
        showToast('Brot-Zutaten auf Einkaufsliste gesetzt!');
      } else if (action === 'ed-add-ing') {
        const list = document.getElementById('ed-ing-list');
        const row = document.createElement('div');
        row.className = 'flex gap-2 items-center ed-ing-row';
        row.innerHTML = `<input type="text" placeholder="Menge" class="w-16 px-2.5 py-2 border border-stone-200 rounded-lg text-sm ed-ing-amt" /><input type="text" placeholder="Einheit" class="w-20 px-2.5 py-2 border border-stone-200 rounded-lg text-sm ed-ing-unit" /><input type="text" placeholder="Zutat" class="flex-1 px-2.5 py-2 border border-stone-200 rounded-lg text-sm ed-ing-name" /><button data-action="ed-remove-row" class="text-stone-400 hover:text-red-600 px-1.5"><i class="fa-solid fa-xmark"></i></button>`;
        list.appendChild(row);
      } else if (action === 'ed-add-step') {
        const list = document.getElementById('ed-step-list');
        const idx = list.children.length + 1;
        const row = document.createElement('div');
        row.className = 'flex gap-2 items-start ed-step-row';
        row.innerHTML = `<span class="mt-2 text-xs font-bold text-stone-400">${idx}.</span><textarea rows="2" class="flex-1 px-3 py-2 border border-stone-200 rounded-lg text-sm ed-step-text"></textarea><button data-action="ed-remove-row" class="mt-2 text-stone-400 hover:text-red-600 px-1.5"><i class="fa-solid fa-xmark"></i></button>`;
        list.appendChild(row);
      } else if (action === 'ed-remove-row') {
        target.closest('.ed-ing-row, .ed-step-row')?.remove();
      } else if (action === 'save-editor') {
        const title = document.getElementById('ed-title').value.trim();
        if (!title) { showToast('Bitte Titel eingeben.', 'error'); return; }
        const ingredients = Array.from(document.querySelectorAll('.ed-ing-row')).map(row => {
          const amt = row.querySelector('.ed-ing-amt').value.trim();
          const unit = row.querySelector('.ed-ing-unit').value.trim();
          const name = row.querySelector('.ed-ing-name').value.trim();
          return name ? { amount: amt, unit, name, aisle: guessAisle(name) } : null;
        }).filter(Boolean);
        const steps = Array.from(document.querySelectorAll('.ed-step-text')).map(ta => ta.value.trim()).filter(Boolean);
        const tags = document.getElementById('ed-tags').value.split(',').map(t => t.trim()).filter(Boolean);
        const selectedCat = document.getElementById('ed-category').value;
        const selectedDiet = document.getElementById('ed-diet').value;
        const drinkRadio = document.querySelector('input[name="ed-drink-type"]:checked');

        const recipeObj = {
          id: state.editingRecipe?.id || 'r_' + Date.now(),
          title,
          category: selectedCat,
          diet: selectedDiet,
          drinkType: selectedCat === 'Getränke' ? (drinkRadio ? drinkRadio.value : 'alkoholfrei') : undefined,
          prepTime: parseInt(document.getElementById('ed-time').value, 10) || 30,
          servings: 4,
          rating: state.editingRecipe?.rating || 0,
          favorite: state.editingRecipe?.favorite || false,
          image: document.getElementById('ed-image').value.trim() || 'https://images.unsplash.com/photo-1495521821757-a1efb6729352?auto=format&fit=crop&w=900&q=80',
          tags,
          notes: document.getElementById('ed-notes').value.trim(),
          ingredients: ingredients.length ? ingredients : [{ amount: 1, unit: '', name: 'Zutat', aisle: 'Sonstiges' }],
          steps: steps.length ? steps : ['Zubereitung']
        };

        if (state.editingRecipe?.id) {
          const i = state.recipes.findIndex(x => x.id === state.editingRecipe.id);
          if (i !== -1) state.recipes[i] = recipeObj;
        } else {
          state.recipes.unshift(recipeObj);
        }
        state.editingRecipe = null;
        saveState();
        state.activeRecipeId = recipeObj.id;
        state.view = 'detail';
        render();
        showToast('Rezept gespeichert!');
      } else if (action === 'import-demo') {
        const demo = JSON.parse(JSON.stringify(DEMO_IMPORTS[parseInt(target.dataset.index, 10)]));
        demo.id = 'r_' + Date.now();
        state.recipes.unshift(demo);
        saveState();
        showToast(`"${demo.title}" übernommen!`);
        state.view = 'recipes';
        render();
      } else if (action === 'add-manual-shopping') {
        const inp = document.getElementById('manual-shop-input');
        if (inp && inp.value.trim()) {
          state.shoppingList.push({ amount: '', unit: '', name: inp.value.trim(), aisle: guessAisle(inp.value), checked: false });
          saveState(); render();
        }
      } else if (action === 'toggle-shop-item') {
        const idx = parseInt(target.dataset.index, 10);
        if (state.shoppingList[idx]) { state.shoppingList[idx].checked = !state.shoppingList[idx].checked; saveState(); render(); }
      } else if (action === 'remove-shop-item') {
        state.shoppingList.splice(parseInt(target.dataset.index, 10), 1);
        saveState(); render();
      } else if (action === 'clear-checked-shopping') {
        state.shoppingList = state.shoppingList.filter(i => !i.checked);
        saveState(); render();
      } else if (action === 'clear-all-shopping') {
        state.shoppingList = [];
        saveState(); render();
      } else if (action === 'open-day-picker') {
        const day = target.dataset.day;
        showModal(`
          <div class="flex items-center justify-between mb-3"><h3 class="font-bold text-stone-900">Rezept für ${day} wählen</h3><button data-action="close-modal" class="text-stone-400"><i class="fa-solid fa-xmark"></i></button></div>
          <div class="space-y-2 max-h-80 overflow-y-auto">
            ${state.recipes.map(r => `<button data-action="assign-day-recipe" data-day="${day}" data-id="${r.id}" class="w-full text-left p-2.5 rounded-xl border border-stone-200 hover:border-orange-500 hover:bg-orange-50 text-sm font-medium">${escapeHtml(r.title)}</button>`).join('')}
          </div>
        `);
      } else if (action === 'assign-day-recipe') {
        const { day, id } = target.dataset;
        if (!state.mealPlan[day]) state.mealPlan[day] = [];
        state.mealPlan[day].push(id);
        saveState(); closeModal(); render();
      } else if (action === 'remove-from-day') {
        state.mealPlan[target.dataset.day].splice(parseInt(target.dataset.index, 10), 1);
        saveState(); render();
      } else if (action === 'planner-to-shopping') {
        let count = 0;
        ['Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag', 'Sonntag'].forEach(day => {
          (state.mealPlan[day] || []).forEach(rid => {
            const r = state.recipes.find(x => x.id === rid);
            if (r) { (r.ingredients || []).forEach(ing => { state.shoppingList.push({ ...ing, checked: false }); count++; }); }
          });
        });
        saveState(); showToast(`${count} Zutaten übertragen!`);
      } else if (action === 'open-install-modal') {
        openInstallModal();
      } else if (action === 'open-storage-modal') {
        openStorageModal();
      } else if (action === 'export-json') {
        const blob = new Blob([JSON.stringify({ recipes: state.recipes, shoppingList: state.shoppingList, mealPlan: state.mealPlan }, null, 2)], { type: 'application/json' });
        const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `rezeptsammler_backup.json`; a.click();
      } else if (action === 'close-modal') {
        closeModal();
      }
    });

    document.addEventListener('input', (e) => {
      const id = e.target.id;
      if (id === 'search-input') {
        state.searchQuery = e.target.value; render();
        const inp = document.getElementById('search-input'); if (inp) { inp.focus(); inp.setSelectionRange(inp.value.length, inp.value.length); }
      } else if (id === 'bread-hydration-range') {
        state.bread.hydration = parseFloat(e.target.value) || 68; saveState(); render();
      } else if (id === 'bread-salt-range') {
        state.bread.saltPct = parseFloat(e.target.value) || 2.2; saveState(); render();
      } else if (id === 'bread-title-input') {
        state.bread.recipeTitle = e.target.value; saveState();
      } else if (e.target.dataset.breadFlourName !== undefined) {
        state.bread.flours[parseInt(e.target.dataset.breadFlourName, 10)].name = e.target.value; saveState();
      } else if (e.target.dataset.breadFlourGrams !== undefined) {
        state.bread.flours[parseInt(e.target.dataset.breadFlourGrams, 10)].grams = parseFloat(e.target.value) || 0; saveState(); render();
      }
    });

    document.addEventListener('change', (e) => {
      if (e.target.id === 'sort-select') { state.sortBy = e.target.value; render(); }
      else if (e.target.id === 'ed-category') {
        const wrap = document.getElementById('ed-drink-type-wrap');
        if (wrap) { if (e.target.value === 'Getränke') wrap.classList.remove('hidden'); else wrap.classList.add('hidden'); }
      }
    });

    loadState();
    render();
  </script>
</body>
</html>
